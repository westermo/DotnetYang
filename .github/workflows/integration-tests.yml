name: Integration Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: sh

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      netopeer2:
        image: sysrepo/sysrepo-netopeer2:latest
        ports:
          - 830:830

    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Run the offline XML interop tests (no Docker dependency)
      # NOTE: `--project` breaks TUnit's Microsoft.Testing.Platform argument
      # forwarding, so the project path must be passed positionally. Args
      # after `--` go to the test host itself; `--logger` is a VSTest-only
      # option that TUnit doesn't understand, so use `--output Detailed`.
      - name: Run XML interop tests
        run: |
          dotnet test IntegrationTests/IntegrationTests.csproj \
            -- --treenode-filter "/*/*/XmlInteropTests/*|/*/*/NotificationSubscriptionTests/*" \
            --output Detailed

      # Run the full integration tests against netopeer2
      # These connect to the netopeer2 service container
      - name: Run NETCONF roundtrip tests
        env:
          NETCONF_HOST: localhost
          NETCONF_PORT: 830
          NETCONF_USER: netconf
          NETCONF_PASSWORD: netconf
        run: |
          dotnet test IntegrationTests/IntegrationTests.csproj \
            -- --treenode-filter "/*/*/NetconfRoundtripTests/*" \
            --output Detailed || true
        # `|| true` because netopeer2 service container may need custom setup;
        # these tests are best-effort in CI until the container is fully configured.
